# pnpm ≥11.24 no longer reads package.json#pnpm — the overrides live HERE so
# lock regeneration keeps the cordis unification on every pnpm version.
# The package.json#pnpm mirror was RETIRED 2026-10-25 (gh#46 review round):
# the mirror's only readers were pre-11.24 pnpm installs, and 11.28's
# verify-deps gate hard-refuses to run ANY script while the field exists
# (field-present ⇒ 'installing would drop pnpm.overrides' ⇒ every
# pnpm-run script blocked — A/B proven on this host). Fleet measured at
# retirement: .156=11.28.5 ✓ · .157=11.28.5 ✓ · .85 upgraded 11.23→11.28.5 ✓
# — no pre-11.24 reader remains (cordis incident 0e32ae1, K3 follow-up ①).
overrides:
  '@deepseek-ai/cordis': 4.0.5
  '@deepseek-ai/cordis-plugin-loader': 1.0.5

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-api-session-controller@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-deque@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-file-reference@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-time@0.1.2-alpha.3'
  - '@deepseek-ai/dsh-util-workspace-path@0.1.2-alpha.3'
