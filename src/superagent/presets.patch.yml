            name: '@deepseek-ai/dsh-mcp-client'
            disabled: !!js process.platform === 'win32'
            config:
              serverName: ygl
              transport: stdio
              command: sh
              args: ['-c', 'YGL_SESSION="superagent-$$" exec ygl-trees mcp']
              # The team's own workspace, apart from the owner's personal one (owner 2026-11-10). Create it once with
              # `YGL_HOME=<dir> ygl-trees db init`; the host runs it at start when the workspace has no database (ygl-home.ts).
              env:
                YGL_HOME: !!js process.env.SUPERAGENT_YGL_HOME ?? `${process.env.HOME ?? process.env.USERPROFILE}/.ygl-trees-superagent`
          - id: mcp-ygl-win
            name: '@deepseek-ai/dsh-mcp-client'
            disabled: !!js process.platform !== 'win32'
            config:
              serverName: ygl
              transport: stdio
              command: cmd
              args: ['/d', '/s', '/c', 'set "YGL_SESSION=superagent-%RANDOM%%RANDOM%" && ygl-trees mcp']
              env:
                YGL_HOME: !!js process.env.SUPERAGENT_YGL_HOME ?? `${process.env.HOME ?? process.env.USERPROFILE}/.ygl-trees-superagent`
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # As DSH's standard preset (owner 2026-11-18): the session's own goal, and presenting files to the person who reads it.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: superagent-observer-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-observer
        name: superagent 团队观察者
        description: superagent 团队的观察者专用：和成员一样接单干活，发现没人提的工作时可以自己开工单，交总工决定。不派活、不开子代理。
        order: 93
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
